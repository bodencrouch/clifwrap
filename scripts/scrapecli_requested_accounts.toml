provider = "scrapecli"
target_env = "SCRAPECLI_API_KEY"
env_file = "~/.config/secrets.env"
env_name_template = "CLIFWRAP_{provider_slug}_{account_slug}_{target_env_slug}"
set_default = true

[validation]
url = "https://api.scrapecli.example/v2/team/credit-usage"
auth_header = "Authorization"
auth_scheme = "Bearer"
content_type = "application/json"
remaining_path = "data.remainingCredits"

[[accounts]]
label = "scrapecli-primary"

[[accounts]]
label = "scrapecli-secondary"

[[accounts]]
label = "scrapecli-tertiary"

[[accounts]]
label = "scrapecli-quaternary"
